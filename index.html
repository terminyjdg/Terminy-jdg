<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaduła - Trener Wymowy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Fredoka', sans-serif; background: #fdf2f8; color: #1f2937; scroll-behavior: smooth; }
    
    /* Pasek górny */
    nav { background: #ec4899; padding: 15px 20px; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
    .logo { font-weight: 700; font-size: 24px; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-btn { background: white; color: #ec4899; border: none; padding: 10px 15px; border-radius: 20px; font-weight: 700; cursor: pointer; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

    /* Ekran startowy */
    .container { max-width: 600px; margin: 20px auto; padding: 0 20px; }
    .welcome-text { text-align: center; font-size: 22px; color: #831843; margin-bottom: 20px; font-weight: 600; }
    
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .letter-card { background: white; border-radius: 20px; padding: 25px 15px; text-align: center; cursor: pointer; box-shadow: 0 8px 0 #fbcfe8; border: 2px solid #fbcfe8; transition: transform 0.1s; }
    .letter-card:active { transform: translateY(4px); box-shadow: 0 4px 0 #fbcfe8; }
    .letter-card .big-letter { font-size: 48px; font-weight: 700; color: #db2777; margin-bottom: 5px; display: block; }
    .letter-card .desc { font-size: 14px; color: #6b7280; font-weight: 600; }

    /* Ekran ćwiczenia */
    #exercise-view { display: none; text-align: center; }
    .back-btn { background: #f3f4f6; color: #4b5563; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; margin-bottom: 20px; display: inline-block; font-size: 16px; }
    
    .word-display { background: white; border-radius: 30px; padding: 40px 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .word-image { font-size: 80px; margin-bottom: 10px; }
    .word-text { font-size: 36px; font-weight: 700; color: #1e3a8a; text-transform: uppercase; letter-spacing: 2px; }
    
    /* Mikrofon / Przycisk akcji */
    .mic-btn { background: #10b981; color: white; border: none; width: 100px; height: 100px; border-radius: 50%; font-size: 40px; cursor: pointer; box-shadow: 0 8px 0 #059669; transition: transform 0.1s; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
    .mic-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #059669; }
    .mic-hint { font-size: 16px; color: #6b7280; font-weight: 600; }

    /* Nawigacja słówek */
    .word-nav { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .word-nav button { background: #fbcfe8; color: #db2777; border: none; padding: 10px 20px; border-radius: 15px; font-weight: 700; cursor: pointer; font-size: 16px; }

    /* Ekrany logowania - ukryte, na razie uproszczone */
    #auth-view { display: none; }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="logo">🐶 Gaduła</a>
    <button class="nav-btn" onclick="pokazLogowanie()">Zaloguj / Zapisz postęp</button>
  </nav>

  <!-- EKRAN GŁÓWNY (WYBÓR GŁOSKI) -->
  <div class="container" id="main-view">
    <div class="welcome-text">Wybierz głoskę do ćwiczenia:</div>
    
    <div class="grid">
      <div class="letter-card" onclick="rozpocznijCwiczenie('R')">
        <span class="big-letter">R</span>
        <span class="desc">np. RAK, ROWER</span>
      </div>
      <div class="letter-card" onclick="rozpocznijCwiczenie('S')">
        <span class="big-letter">S</span>
        <span class="desc">np. SOWA, SER</span>
      </div>
      <div class="letter-card" onclick="rozpocznijCwiczenie('C')">
        <span class="big-letter">C</span>
        <span class="desc">np. CEBULA, CYTRYNA</span>
      </div>
      <div class="letter-card" onclick="rozpocznijCwiczenie('L')">
        <span class="big-letter">L</span>
        <span class="desc">np. LEW, LALKA</span>
      </div>
    </div>
  </div>

  <!-- EKRAN ĆWICZENIA -->
  <div class="container" id="exercise-view">
    <button class="back-btn" onclick="pokazGlowna()">← Wróć do głosek</button>
    
    <div class="word-display">
      <div class="word-image" id="ex-image">🦀</div>
      <div class="word-text" id="ex-word">RAK</div>
    </div>

    <!-- Przycisk imitujący nagrywanie (na razie bez mikrofonu) -->
    <button class="mic-btn" onclick="symulujNagranie()">🎤</button>
    <div class="mic-hint" id="mic-hint">Kliknij i powiedz słowo!</div>

    <div class="word-nav">
      <button onclick="nastepneSlowo()">Następne słowo →</button>
    </div>
  </div>

  <!-- EKRAN LOGOWANIA (Uproszczony na razie) -->
  <div id="auth-view" class="container">
    <button class="back-btn" onclick="pokazGlowna()">← Wróć</button>
    <h2 style="text-align:center; margin-bottom:20px; color:#831843;">Zaloguj się, aby zapisywać postępy</h2>
    <p style="text-align:center;">Logowanie jest w trakcie budowy. Wróć wkrótce!</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
